<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flamAI AI Assignment 2026 — Interactive Audit & Desmos Dashboard</title>
  <!-- Load Official Desmos API -->
  <script src="https://www.desmos.com/api/v1.9/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --bg-card: #1e293b;
      --border-color: #334155;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-primary); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: var(--bg-secondary); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
    .logo-group { display: flex; align-items: center; gap: 12px; }
    .badge { background: #0369a1; color: #e0f2fe; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    h1 { font-size: 1.15rem; font-weight: 700; color: var(--accent-blue); letter-spacing: -0.02em; }
    .tabs { display: flex; gap: 8px; }
    .tab-btn { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.2s; }
    .tab-btn:hover { background: #334155; color: #fff; }
    .tab-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }
    #app-body { display: flex; flex: 1; overflow: hidden; }
    #calculator-container { flex: 1; height: 100%; position: relative; }
    #calculator { width: 100%; height: 100%; }
    #sidebar { width: 420px; background: var(--bg-secondary); border-left: 1px solid var(--border-color); padding: 20px; overflow-y: auto; font-size: 0.88rem; line-height: 1.6; }
    h2 { font-size: 1.1rem; color: var(--accent-blue); margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
    h3 { font-size: 0.95rem; color: #cbd5e1; margin: 16px 0 6px; font-weight: 600; }
    p { margin-bottom: 10px; color: #cbd5e1; }
    .code-box { background: #050811; border: 1px solid var(--border-color); padding: 10px 12px; border-radius: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; color: #facc15; margin: 10px 0; font-size: 0.82rem; line-height: 1.5; }
    .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1e293b; }
    .stat-label { color: var(--text-muted); }
    .stat-val { font-weight: 600; color: #f8fafc; }
    .badge-warn { background: #7f1d1d; color: #fecaca; }
    .badge-success { background: #14532d; color: #bbf7d0; }
    .links-bar { display: flex; gap: 10px; margin-top: 14px; }
    .link-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-card); color: var(--accent-blue); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 0.8rem; font-weight: 600; }
    .link-btn:hover { background: #334155; }
  </style>
</head>
<body>

  <header>
    <div class="logo-group">
      <span class="badge">Audit Live</span>
      <h1>flamAI AI Assignment 2026 — Desmos Interactive Dashboard</h1>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('capacity')">Part B1/B2: KV-Cache & Preemption</button>
      <button class="tab-btn" onclick="switchTab('throughput')">Part B2/B3: Throughput vs Myth</button>
      <button class="tab-btn" onclick="switchTab('fertility')">Part A3: Tokenizer Fertility</button>
    </div>
  </header>

  <div id="app-body">
    <div id="calculator-container">
      <div id="calculator"></div>
    </div>
    <div id="sidebar">
      <div id="sidebar-content">
        <!-- Content dynamic -->
      </div>
    </div>
  </div>

  <script>
    var elt = document.getElementById('calculator');
    var calculator = Desmos.GraphingCalculator(elt, {
      keypad: true,
      expressions: true,
      settingsMenu: true,
      zoomButtons: true,
      border: false
    });

    var tabData = {
      capacity: {
        title: "Part B1 & B2: KV-Cache VRAM & Preemption Boundary",
        render: `
          <p>Models the exact GPU VRAM footprint as a function of concurrent 4096-token sequence requests $x$ on an NVIDIA L4 GPU.</p>
          
          <h3>Mathematical Equation:</h3>
          <div class="code-box">
            KV_bytes/tok = 2 × 28 × 8 × 128 × 2 = 112 KB<br>
            KV_per_4096_seq = 4096 × 112 KB = 0.469768 GB<br>
            M(x) = 8.4 (Weights) + 1.6 (Overhead) + 0.469768x
          </div>

          <h3>Key Thresholds & Derivations:</h3>
          <div class="stat-row">
            <span class="stat-label">Usable VRAM Ceiling (0.92 × 24GB):</span>
            <span class="stat-val" style="color: #ef4444;">22.08 GB</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Max KV Token Capacity:</span>
            <span class="stat-val">113,097 tokens</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Max Safe Concurrency Limit:</span>
            <span class="stat-val" style="color: #22c55e;">27–28 sequences (x ≈ 25.7)</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Batch 32 Preemption Spike:</span>
            <span class="stat-val badge-warn" style="padding: 2px 6px; border-radius: 4px;">7 Preemptions</span>
          </div>

          <h3>Why Preemption Collapses Throughput:</h3>
          <p>At batch 32, required tokens (131,072) exceed the 113k KV capacity. vLLM evicts KV blocks, forcing redundant prefill recomputations and degrading throughput from 1607 to 1384 tok/s.</p>
        `,
        graph: function() {
          calculator.setBlank();
          calculator.setMathBounds({ left: -2, right: 55, bottom: -2, top: 32 });
          calculator.setExpression({ id: 'mem', latex: 'M(x) = 8.4 + 1.6 + 0.469768x', color: '#38bdf8', lineStyle: Desmos.Styles.SOLID });
          calculator.setExpression({ id: 'ceil', latex: 'y = 22.08', color: '#ef4444', lineStyle: Desmos.Styles.DASHED });
          calculator.setExpression({ id: 'vram', latex: 'y = 24', color: '#64748b', lineStyle: Desmos.Styles.DOTTED });
          calculator.setExpression({ id: 'safe_bound', latex: 'x = 25.7', color: '#22c55e', lineStyle: Desmos.Styles.DASHED });
          calculator.setExpression({
            id: 'points',
            latex: 'P = [(4, 11.93), (8, 13.74), (16, 17.48), (24, 21.23), (32, 21.71), (48, 21.71)]',
            color: '#facc15',
            pointSize: 9
          });
          calculator.setExpression({ id: 'lbl_p24', latex: '(24, 21.23)', label: 'Batch 24 (93% util, Peak)', showLabel: true });
          calculator.setExpression({ id: 'lbl_p32', latex: '(32, 21.71)', label: 'Batch 32 (7 Preemptions!)', showLabel: true });
        }
      },

      throughput: {
        title: "Part B2 & B3: Throughput Anomaly vs. 3200 tok/s Myth",
        render: `
          <p>Contrasts the reported throughput of short vs long prompts, debunking the false linear extrapolation claimed in REPORT_v0.</p>
          
          <h3>Throughput Comparison:</h3>
          <div class="stat-row">
            <span class="stat-label">Short Prompt (512+256) at Batch 64:</span>
            <span class="stat-val" style="color: #38bdf8;">2,267.3 tok/s</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Long Prompt (3584+512) Peak (Batch 24):</span>
            <span class="stat-val" style="color: #22c55e;">1,607.4 tok/s</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Long Prompt at Batch 48 (Actual):</span>
            <span class="stat-val badge-warn" style="padding: 2px 6px; border-radius: 4px;">1,298.5 tok/s (19% Drop)</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Report v0 Fictional Prediction:</span>
            <span class="stat-val" style="color: #a855f7;">~3,200 tok/s</span>
          </div>

          <h3>Honest Decode Goodput:</h3>
          <div class="code-box">
            Goodput_batch24 = (24 × 512 gen) / 61.16s = 200.9 tok/s<br>
            ITL-based = 24 × (1000 / 96.07ms) = 249.8 tok/s
          </div>
          <p>87.5% of reported tokens in the 1607 tok/s metric were prompt prefill overhead, not delivered generation.</p>
        `,
        graph: function() {
          calculator.setBlank();
          calculator.setMathBounds({ left: -5, right: 70, bottom: -100, top: 2600 });
          calculator.setExpression({
            id: 'pts_short',
            latex: 'S = [(1, 70.2), (2, 132.3), (4, 261.0), (8, 495.4), (16, 883.2), (32, 1489.6), (64, 2267.3)]',
            color: '#38bdf8',
            pointSize: 8,
            lines: true
          });
          calculator.setExpression({
            id: 'pts_long',
            latex: 'L = [(4, 565.4), (8, 902.6), (16, 1311.4), (24, 1607.4), (32, 1384.0), (48, 1298.5)]',
            color: '#ef4444',
            pointSize: 9,
            lines: true
          });
          calculator.setExpression({ id: 'lbl_peak', latex: '(24, 1607.4)', label: 'Peak: Batch 24 (1607 tok/s)', showLabel: true });
          calculator.setExpression({ id: 'lbl_drop', latex: '(48, 1298.5)', label: 'Collapse: Batch 48 (1298 tok/s)', showLabel: true });
          calculator.setExpression({ id: 'linear_myth', latex: 'y = 66.97x', color: '#a855f7', lineStyle: Desmos.Styles.DOTTED });
          calculator.setExpression({ id: 'lbl_myth', latex: '(48, 3214)', label: 'Report v0 Fictional Myth (3200 tok/s)', showLabel: true });
        }
      },

      fertility: {
        title: "Part A3: Tokenizer Fertility (GPT-2 vs Google MuRIL)",
        render: `
          <p>Proves with measured evidence that high Indic fertility is an artifact of tokenizer vocabulary bias rather than script complexity.</p>

          <h3>Tokens per Sentence Benchmark:</h3>
          <div class="code-box">
            English:  GPT-2 = 26.8  |  MuRIL = 26.6 (1.0x)<br>
            Hindi:    GPT-2 = 171.4 |  MuRIL = 23.7 (0.89x)<br>
            Kannada:  GPT-2 = 281.1 |  MuRIL = 20.2 (0.76x)<br>
            Tamil:    GPT-2 = 305.5 |  MuRIL = 19.8 (0.74x)
          </div>

          <h3>Why GPT-2 Fails for Dravidian Scripts:</h3>
          <p>For Kannada and Tamil, GPT-2 has <code>tok/byte ≈ 0.98–0.99</code> because it has zero Dravidian vocabulary merges and emits raw individual bytes. MuRIL completely eliminates this penalty.</p>
          
          <h3>Routing Denominator Conclusion:</h3>
          <p><b>Tokens per Semantic Unit (Sentence / Turn)</b> is the only metric holding information content constant across languages.</p>
        `,
        graph: function() {
          calculator.setBlank();
          calculator.setMathBounds({ left: 0, right: 5, bottom: -20, top: 350 });
          calculator.setExpression({
            id: 'gpt2_bar',
            latex: 'G = [(1, 26.8), (2, 171.4), (3, 281.1), (4, 305.5)]',
            color: '#ef4444',
            pointSize: 10
          });
          calculator.setExpression({
            id: 'muril_bar',
            latex: 'M = [(1, 26.6), (2, 23.7), (3, 20.2), (4, 19.8)]',
            color: '#22c55e',
            pointSize: 10
          });
          calculator.setExpression({ id: 'l1', latex: '(1, 26.8)', label: 'Eng (GPT-2: 26.8 | MuRIL: 26.6)', showLabel: true });
          calculator.setExpression({ id: 'l2', latex: '(2, 171.4)', label: 'Hin (GPT-2: 171.4 | MuRIL: 23.7)', showLabel: true });
          calculator.setExpression({ id: 'l3', latex: '(3, 281.1)', label: 'Kan (GPT-2: 281.1 | MuRIL: 20.2)', showLabel: true });
          calculator.setExpression({ id: 'l4', latex: '(4, 305.5)', label: 'Tam (GPT-2: 305.5 | MuRIL: 19.8)', showLabel: true });
        }
      }
    };

    function switchTab(key) {
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      event.target.classList.add('active');
      document.getElementById('sidebar-content').innerHTML = `<h2>${tabData[key].title}</h2>${tabData[key].render}`;
      tabData[key].graph();
    }

    // Initialize with capacity tab
    document.getElementById('sidebar-content').innerHTML = `<h2>${tabData['capacity'].title}</h2>${tabData['capacity'].render}`;
    tabData['capacity'].graph();
  </script>
</body>
</html>
